<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e63b29">
  <meta name="description" content="Random Fatboy entscheidet, wer als Nächstes dran ist.">
  <title>Random Fatboy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260710a">
</head>

<body>
  <div class="noise" aria-hidden="true"></div>
  <header>
    <a href="../" aria-label="Zurück zur Playlist">←</a>
    <span>Fatboys Entscheidungshilfe</span>
    <img src="../img/logo.png" alt="">
  </header>

  <main>
    <button id="draw-button" class="draw-stage" type="button" aria-describedby="draw-hint">
      <span class="kicker">Random Fatboy</span>
      <span id="result" class="result" aria-live="polite">Wer ist<br>dran?</span>
      <span id="draw-hint" class="draw-hint">Irgendwo tippen</span>
    </button>

    <div id="history" class="history" hidden>
      <span>Zuletzt</span>
      <ol id="history-list"></ol>
    </div>
  </main>

  <script src="app.js?v=20260710a"></script>
</body>

</html>
